[package]
name = "parquet-file-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only fsspec filesystem over parquet archives: ls, cat and glob the files stored inside parquet shards"
keywords = ["parquet", "fsspec", "filesystem", "arrow", "dataset"]
categories = ["filesystem"]

[lib]
name = "parquet_file_fs"

[dependencies]
parquet = { version = "55", features = ["arrow"] }
arrow-array = "55"
arrow-cast = "55"
arrow-schema = "55"
object_store = { version = "0.12", features = ["aws", "http"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
bytes = "1"
glob = "0.3"
globset = "0.4"
lru = "0.12"
once_cell = "1"
thiserror = "2"
url = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma"] }
tar = "0.4.46"
flate2 = "1.1.9"
bzip2 = "0.6.1"
liblzma = "0.4.7"
zstd = "0.13.3"
sevenz-rust2 = "0.21.3"
unrar = { version = "0.5.8", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
rar = ["dep:unrar"]
