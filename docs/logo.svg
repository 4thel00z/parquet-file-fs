<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="parquet-file-fs">
  <title>parquet-file-fs</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- Self-contained tile: carries its own background so the mark reads the
       same in light and dark READMEs. -->
  <rect x="8" y="8" width="144" height="144" rx="32" fill="url(#tile)"/>

  <!-- Columnar storage: three parquet columns, baseline-aligned. -->
  <g>
    <rect x="32" y="48" width="10" height="64" rx="5" fill="#fbbf24"/>
    <rect x="48" y="36" width="10" height="76" rx="5" fill="#f59e0b"/>
    <rect x="64" y="58" width="10" height="54" rx="5" fill="#f97316"/>
  </g>

  <!-- Divider: columns on the left become files on the right. -->
  <rect x="82" y="40" width="2" height="72" rx="1" fill="#e5e7eb" opacity="0.22"/>

  <!-- Directory listing: the files those columns hold. -->
  <g fill="#e5e7eb">
    <rect x="92" y="50" width="38" height="8" rx="4"/>
    <rect x="92" y="74" width="26" height="8" rx="4" opacity="0.82"/>
    <rect x="92" y="98" width="32" height="8" rx="4" opacity="0.64"/>
  </g>
</svg>
